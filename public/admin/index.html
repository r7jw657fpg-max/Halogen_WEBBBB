<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Kulturverein Halogen</title>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
  body { margin:0; font-family:"Helvetica Neue",Arial,sans-serif; background:#1a1a1a; color:#f4f1ea; }
  header { padding:24px 32px; border-bottom:1px solid #333; }
  main { padding:32px; max-width:800px; }
  section { margin-bottom:40px; padding:20px; background:#222; border-radius:10px; }
  h2 { margin-top:0; font-size:1.1rem; text-transform:uppercase; letter-spacing:0.05em; }
  label { display:block; margin:12px 0 4px; font-size:0.85rem; color:#bbb; }
  input[type=text], textarea { width:100%; padding:8px; border-radius:6px; border:1px solid #444; background:#111; color:#f4f1ea; font-family:inherit; }
  textarea { min-height:100px; }
  button { margin-top:14px; padding:10px 18px; background:#ffb703; border:none; border-radius:6px; font-weight:600; cursor:pointer; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .status { font-size:0.85rem; margin-left:10px; color:#8f8; }
  img.preview { max-width:200px; display:block; margin-top:10px; border-radius:6px; }
</style>
</head>
<body>
<header><strong>Kulturverein Halogen – Admin</strong></header>
<main>

  <section>
    <h2>Hero-Bild</h2>
    <input type="file" id="hero-file" accept="image/*">
    <button id="hero-upload-btn">Bild hochladen & setzen</button>
    <span class="status" id="hero-status"></span>
    <img class="preview" id="hero-preview">
  </section>

  <section>
    <h2>Panels (Startseite)</h2>
    <div class="grid" id="panels-grid"></div>
    <button id="save-panels-btn">Panels speichern</button>
    <span class="status" id="panels-status"></span>
  </section>

  <section>
    <h2>Unterseiten</h2>
    <div id="pages-editor"></div>
  </section>

  <section>
    <h2>Dateien (PDF, Bilder, etc.)</h2>
    <p style="font-size:0.85rem; color:#999; margin-top:0;">Datei hochladen, dann den Link in den HTML-Inhalt einer Unterseite einfügen, z. B. <code>&lt;a href="LINK"&gt;Programm als PDF&lt;/a&gt;</code>.</p>
    <input type="file" id="generic-file">
    <button id="generic-upload-btn">Hochladen</button>
    <span class="status" id="generic-status"></span>
    <div id="generic-result" style="margin-top:10px; word-break:break-all;"></div>
  </section>

</main>

<script>
const PAGE_SLUGS = ["programm", "anmeldung", "produkte", "weiteres"];
const CHUNK_SIZE = 8 * 1024 * 1024; // 8MB pro Chunk

// iPhone-Fotos kommen oft als HEIC/HEIF – das kann außer Safari kaum ein
// Browser anzeigen (weder als <img> noch als CSS-Hintergrundbild). Deshalb
// wird vor dem Upload automatisch nach JPEG konvertiert.
async function convertHeicIfNeeded(file, onStatus) {
  const isHeic = /\.(heic|heif)$/i.test(file.name) || file.type === "image/heic" || file.type === "image/heif";
  if (!isHeic) return file;
  onStatus && onStatus("Konvertiere HEIC-Bild...");
  const converted = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.9 });
  const blob = Array.isArray(converted) ? converted[0] : converted;
  const newName = file.name.replace(/\.(heic|heif)$/i, ".jpg");
  return new File([blob], newName, { type: "image/jpeg" });
}

async function saveContent(body) {
  const res = await fetch("/api/admin/content", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`Server antwortete mit ${res.status}`);
}

// Lädt eine Datei hoch. Kleine Dateien gehen in einem Request raus,
// größere werden in Chunks zerlegt (Multipart-Upload über R2), damit
// weder das Worker-Request-Limit noch der Arbeitsspeicher ein Problem sind.
async function uploadFile(file, onProgress, onStatus) {
  file = await convertHeicIfNeeded(file, onStatus);

  if (file.size <= CHUNK_SIZE) {
    const formData = new FormData();
    formData.append("file", file);
    const res = await fetch("/api/admin/upload", { method: "POST", body: formData }).then(r => r.json());
    onProgress && onProgress(1);
    return res.url;
  }

  const { key, uploadId } = await fetch("/api/admin/upload/create", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename: file.name, contentType: file.type || "application/octet-stream" }),
  }).then(r => r.json());

  const totalParts = Math.ceil(file.size / CHUNK_SIZE);
  const parts = [];

  try {
    for (let i = 0; i < totalParts; i++) {
      const start = i * CHUNK_SIZE;
      const chunk = file.slice(start, Math.min(start + CHUNK_SIZE, file.size));
      const partNumber = i + 1;
      const part = await fetch(
        `/api/admin/upload/part?key=${encodeURIComponent(key)}&uploadId=${encodeURIComponent(uploadId)}&partNumber=${partNumber}`,
        { method: "PUT", body: chunk }
      ).then(r => r.json());
      parts.push({ partNumber, etag: part.etag });
      onProgress && onProgress((i + 1) / totalParts);
    }

    const done = await fetch("/api/admin/upload/complete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, uploadId, parts }),
    }).then(r => r.json());

    return done.url;
  } catch (err) {
    await fetch("/api/admin/upload/abort", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, uploadId }),
    }).catch(() => {});
    throw err;
  }
}

async function loadContent() {
  const content = await fetch("/api/content").then(r => r.json());

  document.getElementById("hero-preview").src = content.hero_image_url || "";

  const grid = document.getElementById("panels-grid");
  grid.innerHTML = "";
  for (let i = 1; i <= 4; i++) {
    grid.innerHTML += `
      <div>
        <label>Panel ${i} – Titel</label>
        <input type="text" id="panel_${i}_label" value="${content[`panel_${i}_label`] || ""}">
        <label>Panel ${i} – Link</label>
        <input type="text" id="panel_${i}_link" value="${content[`panel_${i}_link`] || ""}">
        <label>Panel ${i} – Bild</label>
        <input type="file" id="panel_${i}_file" accept="image/*">
        <span class="status" id="panel_${i}_img_status"></span>
        <img class="preview" id="panel_${i}_preview" src="${content[`panel_${i}_image_url`] || ""}">
      </div>`;
  }

  for (let i = 1; i <= 4; i++) {
    document.getElementById(`panel_${i}_file`).addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const status = document.getElementById(`panel_${i}_img_status`);
      try {
        const url = await uploadFile(
          file,
          (p) => { status.textContent = `Lädt hoch... ${Math.round(p * 100)}%`; },
          (msg) => { status.textContent = msg; }
        );
        await saveContent({ [`panel_${i}_image_url`]: url });
        document.getElementById(`panel_${i}_preview`).src = url;
        status.textContent = "Gespeichert ✓";
      } catch (err) {
        status.textContent = "Fehler: " + (err.message || "Upload fehlgeschlagen");
        console.error(err);
      }
      setTimeout(() => status.textContent = "", 3500);
    });
  }
}

async function loadPages() {
  const editor = document.getElementById("pages-editor");
  editor.innerHTML = "";
  for (const slug of PAGE_SLUGS) {
    const data = await fetch(`/api/pages/${slug}`).then(r => r.json());
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "24px";
    wrap.innerHTML = `
      <label>${slug} – Titel</label>
      <input type="text" id="title_${slug}" value="${data.title || ""}">
      <label>${slug} – Inhalt (HTML erlaubt)</label>
      <textarea id="content_${slug}">${data.content || ""}</textarea>
      <button data-slug="${slug}" class="save-page-btn">Speichern</button>
      <span class="status" id="status_${slug}"></span>
    `;
    editor.appendChild(wrap);
  }
  document.querySelectorAll(".save-page-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const slug = btn.dataset.slug;
      const title = document.getElementById(`title_${slug}`).value;
      const content = document.getElementById(`content_${slug}`).value;
      const status = document.getElementById(`status_${slug}`);
      try {
        const res = await fetch(`/api/admin/pages/${slug}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, content }),
        });
        if (!res.ok) throw new Error(`Server antwortete mit ${res.status}`);
        status.textContent = "Gespeichert ✓";
      } catch (err) {
        status.textContent = "Fehler: " + (err.message || "Speichern fehlgeschlagen");
        console.error(err);
      }
      setTimeout(() => status.textContent = "", 3500);
    });
  });
}

document.getElementById("hero-upload-btn").addEventListener("click", async () => {
  const fileInput = document.getElementById("hero-file");
  if (!fileInput.files[0]) return;
  const status = document.getElementById("hero-status");
  try {
    const url = await uploadFile(
      fileInput.files[0],
      (p) => { status.textContent = `Lädt hoch... ${Math.round(p * 100)}%`; },
      (msg) => { status.textContent = msg; }
    );
    await saveContent({ hero_image_url: url });
    status.textContent = "Gespeichert ✓";
    document.getElementById("hero-preview").src = url;
  } catch (err) {
    status.textContent = "Fehler: " + (err.message || "Upload fehlgeschlagen");
    console.error(err);
  }
  setTimeout(() => status.textContent = "", 3500);
});

document.getElementById("save-panels-btn").addEventListener("click", async () => {
  const status = document.getElementById("panels-status");
  const body = {};
  for (let i = 1; i <= 4; i++) {
    body[`panel_${i}_label`] = document.getElementById(`panel_${i}_label`).value;
    body[`panel_${i}_link`] = document.getElementById(`panel_${i}_link`).value;
  }
  try {
    await saveContent(body);
    status.textContent = "Gespeichert ✓";
  } catch (err) {
    status.textContent = "Fehler: " + (err.message || "Speichern fehlgeschlagen");
    console.error(err);
  }
  setTimeout(() => status.textContent = "", 3500);
});

document.getElementById("generic-upload-btn").addEventListener("click", async () => {
  const fileInput = document.getElementById("generic-file");
  if (!fileInput.files[0]) return;
  const status = document.getElementById("generic-status");
  try {
    const url = await uploadFile(
      fileInput.files[0],
      (p) => { status.textContent = `Lädt hoch... ${Math.round(p * 100)}%`; },
      (msg) => { status.textContent = msg; }
    );
    status.textContent = "Hochgeladen ✓";
    document.getElementById("generic-result").innerHTML =
      `<a href="${url}" target="_blank" style="color:#ffb703;">${url}</a> ` +
      `<button type="button" class="copy-link-btn" data-url="${url}">Link kopieren</button>`;
  } catch (err) {
    status.textContent = "Fehler: " + (err.message || "Upload fehlgeschlagen");
    console.error(err);
  }
  setTimeout(() => status.textContent = "", 3500);
});

document.addEventListener("click", (e) => {
  if (e.target.classList.contains("copy-link-btn")) {
    navigator.clipboard.writeText(e.target.dataset.url).then(() => {
      e.target.textContent = "Kopiert ✓";
      setTimeout(() => e.target.textContent = "Link kopieren", 1500);
    });
  }
});

loadContent();
loadPages();
</script>
</body>
</html>
