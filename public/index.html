<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kulturverein Halogen</title>
<style>
  :root {
    --panel-bg: rgba(15, 15, 15, 0.82);
    --panel-fg: #f4f1ea;
    --accent: #ffb703;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  #hero {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-color: #111;
  }
  #hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55));
  }
  .wordmark-vertical {
    position: fixed;
    top: 0;
    bottom: 0;
    padding: 28px 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    color: var(--panel-fg);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 600;
    z-index: 5;
    mix-blend-mode: difference;
    pointer-events: none;
  }
  .wordmark-vertical span {
    display: block;
    line-height: 1;
  }
  #wordmark-left { left: 18px; }
  #wordmark-right { right: 18px; }
  .panel {
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 16px;
    background: var(--panel-bg);
    background-size: cover;
    background-position: center;
    color: var(--panel-fg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(2px);
    transition: background 0.2s ease, filter 0.15s ease;
    will-change: transform;
    z-index: 3;
    user-select: none;
    overflow: hidden;
  }
  .panel:not(.has-image):hover {
    background: var(--accent);
    color: #111;
  }
  .panel.has-image:hover {
    filter: brightness(1.15);
  }
  .panel.has-image::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.6));
  }
  .panel-label {
    position: relative;
    z-index: 1;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 0 12px;
  }

  #tube-fixture {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: min(640px, 85vw);
    height: 24px;
    z-index: 20;
    pointer-events: none;
  }
  #tube-glow {
    position: absolute;
    inset: -60px -30px auto -30px;
    height: 150px;
    background: radial-gradient(ellipse at center, rgba(226,240,255,0.55), rgba(226,240,255,0) 70%);
    opacity: 0;
    filter: blur(2px);
  }
  #tube-light {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffffff, #dce9ff);
    box-shadow: 0 0 14px 4px rgba(220,233,255,0.9), 0 0 40px 10px rgba(180,210,255,0.5);
    opacity: 0;
  }
  #tube-light::before, #tube-light::after {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 32px;
    background: #333;
    border-radius: 3px;
  }
  #tube-light::before { left: -12px; }
  #tube-light::after { right: -12px; }

  #dark-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 1.2s ease;
  }
  #dark-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #dark-message {
    text-align: center;
    color: #e8e8e8;
    animation: dark-blink 1.8s ease-in-out infinite;
    transition: opacity 0.3s ease;
  }
  #dark-overlay.revealing #dark-message {
    animation: none;
    opacity: 0;
  }
  #dark-message .line1 {
    display: block;
    font-size: 1.3rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  #dark-message .line2 {
    display: block;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: #999;
    text-transform: uppercase;
  }
  @keyframes dark-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
</style>
</head>
<body>
  <div id="hero"></div>
  <div id="wordmark-left" class="wordmark-vertical"></div>
  <div id="wordmark-right" class="wordmark-vertical"></div>
  <div id="panel-container"></div>

  <div id="tube-fixture">
    <div id="tube-glow"></div>
    <div id="tube-light"></div>
  </div>

  <div id="dark-overlay">
    <div id="dark-message">
      <span class="line1">Zu dunkel hier drin.</span>
      <span class="line2">Klicken, um Licht zu machen.</span>
    </div>
  </div>

<script>
(function () {
  // Vertikale Wortmarke: Buchstaben von oben nach unten, links "Halogen",
  // rechts "Kulturverein". Beide Wörter füllen exakt die Viewport-Höhe,
  // die Schriftgröße pro Buchstabe ergibt sich automatisch aus der
  // Buchstabenanzahl – "Kulturverein" hat mehr Buchstaben, wird also
  // pro Buchstabe kleiner als "Halogen".
  function buildVerticalWord(container, word) {
    container.innerHTML = "";
    for (const ch of word) {
      const span = document.createElement("span");
      span.textContent = ch;
      container.appendChild(span);
    }
  }
  function sizeVerticalWord(container) {
    const available = window.innerHeight - 56; // minus vertikales Padding
    const count = container.children.length;
    const fontSize = Math.max(8, (available / count) * 0.82);
    container.style.fontSize = fontSize + "px";
  }
  const wordLeft = document.getElementById("wordmark-left");
  const wordRight = document.getElementById("wordmark-right");
  buildVerticalWord(wordLeft, "HALOGEN");
  buildVerticalWord(wordRight, "KULTURVEREIN");
  function resizeWordmarks() {
    sizeVerticalWord(wordLeft);
    sizeVerticalWord(wordRight);
  }
  resizeWordmarks();
  window.addEventListener("resize", resizeWordmarks);
})();
</script>

<script>
(async function () {
  const container = document.getElementById("panel-container");
  const hero = document.getElementById("hero");

  let content = {};
  try {
    content = await fetch("/api/content").then(r => r.json());
  } catch (e) {
    console.warn("Konnte Inhalte nicht laden, nutze Standardwerte.", e);
  }

  if (content.hero_image_url) {
    hero.style.backgroundImage = `url(${content.hero_image_url})`;
  }

  const panelDefs = [1, 2, 3, 4].map(i => ({
    label: content[`panel_${i}_label`] || `Panel ${i}`,
    link: content[`panel_${i}_link`] || "#",
    image: content[`panel_${i}_image_url`] || "",
  }));

  const SIZE = 190;
  const SPEED = 0.7;

  // Klont das angeklickte Panel und animiert es auf volle Bildschirmgröße,
  // bevor zur Unterseite navigiert wird ("reinzoomen" ins Panel).
  function zoomIntoPanel(el, link) {
    const rect = el.getBoundingClientRect();
    const clone = el.cloneNode(true);
    clone.style.position = "fixed";
    clone.style.left = rect.left + "px";
    clone.style.top = rect.top + "px";
    clone.style.width = rect.width + "px";
    clone.style.height = rect.height + "px";
    clone.style.margin = "0";
    clone.style.zIndex = "50";
    clone.style.transition = "left 0.5s ease, top 0.5s ease, width 0.5s ease, height 0.5s ease, border-radius 0.5s ease";
    document.body.appendChild(clone);
    clone.getBoundingClientRect(); // reflow erzwingen, damit die Transition greift

    requestAnimationFrame(() => {
      clone.style.left = "0px";
      clone.style.top = "0px";
      clone.style.width = "100vw";
      clone.style.height = "100vh";
      clone.style.borderRadius = "0px";
    });

    setTimeout(() => { window.location.href = link; }, 520);
  }

  const panels = panelDefs.map((def, i) => {
    const el = document.createElement("div");
    el.className = "panel";
    if (def.image) {
      el.classList.add("has-image");
      el.style.backgroundImage = `url(${def.image})`;
    }
    const labelSpan = document.createElement("span");
    labelSpan.className = "panel-label";
    labelSpan.textContent = def.label;
    el.appendChild(labelSpan);
    el.addEventListener("click", () => {
      if (def.link === "#") return;
      zoomIntoPanel(el, def.link);
    });
    container.appendChild(el);

    const angle = Math.random() * Math.PI * 2;
    return {
      el,
      x: Math.random() * (window.innerWidth - SIZE),
      y: Math.random() * (window.innerHeight - SIZE),
      vx: Math.cos(angle) * SPEED,
      vy: Math.sin(angle) * SPEED,
    };
  });

  function step() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    for (const p of panels) {
      p.x += p.vx;
      p.y += p.vy;

      if (p.x <= 0) { p.x = 0; p.vx *= -1; }
      if (p.x + SIZE >= w) { p.x = w - SIZE; p.vx *= -1; }
      if (p.y <= 0) { p.y = 0; p.vy *= -1; }
      if (p.y + SIZE >= h) { p.y = h - SIZE; p.vy *= -1; }

      p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
    }

    // Panel-zu-Panel-Kollision (Kreis-Annäherung): Positionen sauber
    // auseinanderschieben, damit sich die Panels nicht ineinander
    // verhaken, plus elastische Reflexion entlang der Kollisionsachse.
    const MIN_DIST = SIZE * 0.9;
    for (let i = 0; i < panels.length; i++) {
      for (let j = i + 1; j < panels.length; j++) {
        const a = panels[i], b = panels[j];
        const dx = (b.x + SIZE/2) - (a.x + SIZE/2);
        const dy = (b.y + SIZE/2) - (a.y + SIZE/2);
        const dist = Math.hypot(dx, dy);
        if (dist > 0 && dist < MIN_DIST) {
          const nx = dx / dist;
          const ny = dy / dist;

          const overlap = MIN_DIST - dist;
          a.x -= nx * overlap / 2;
          a.y -= ny * overlap / 2;
          b.x += nx * overlap / 2;
          b.y += ny * overlap / 2;

          const avn = a.vx * nx + a.vy * ny;
          const bvn = b.vx * nx + b.vy * ny;
          a.vx += (bvn - avn) * nx;
          a.vy += (bvn - avn) * ny;
          b.vx += (avn - bvn) * nx;
          b.vy += (avn - bvn) * ny;
        }
      }
    }

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>

<script>
(function () {
  const overlay = document.getElementById("dark-overlay");
  const tubeLight = document.getElementById("tube-light");
  const tubeGlow = document.getElementById("tube-glow");
  let started = false;

  function playFlicker() {
    // [Verzögerung in ms, Helligkeit 0-1] – simuliert eine Röhre, die
    // erst ein paar Mal ansetzt, bevor sie stabil an bleibt.
    const steps = [
      [40, 0.9], [70, 0], [900, 0],
      [30, 0.8], [40, 0], [25, 0.7], [200, 0],
      [20, 1], [15, 0], [15, 1], [10, 0], [15, 1], [10, 0], [180, 0],
      [15, 1], [15, 0], [500, 1],
    ];
    let t = 0;
    for (const [delay, brightness] of steps) {
      t += delay;
      setTimeout(() => {
        tubeLight.style.opacity = brightness;
        tubeGlow.style.opacity = brightness * 0.8;
      }, t);
    }
    setTimeout(() => overlay.classList.add("hidden"), t + 500);
  }

  overlay.addEventListener("click", () => {
    if (started) return;
    started = true;
    overlay.classList.add("revealing");
    overlay.style.pointerEvents = "none";
    playFlicker();
  });
})();
</script>
</body>
</html>
