<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kulturverein Halogen</title>
<style>
  :root {
    --panel-fg: #f4f1ea;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  #hero {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-color: #111;
  }
  #hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55));
  }
  .wordmark-vertical {
    position: fixed;
    top: 0;
    bottom: 0;
    padding: 28px 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    color: var(--panel-fg);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 300;
    z-index: 5;
    mix-blend-mode: difference;
    pointer-events: none;
  }
  .wordmark-vertical span {
    display: block;
    line-height: 1;
  }
  #wordmark-left { left: 18px; }
  #wordmark-right { right: 18px; }
  #pillar-container {
    position: fixed;
    top: 140px;
    left: 0;
    right: 0;
    bottom: 60px;
    display: flex;
    align-items: stretch;
    justify-content: space-evenly;
    padding: 0 80px;
    z-index: 3;
  }
  .tube-pillar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-width: 90px;
    cursor: pointer;
    user-select: none;
  }
  .pillar-bg {
    position: absolute;
    inset: -50px -70px;
    background-size: cover;
    background-position: center;
    opacity: 0.32;
    filter: blur(0.5px) brightness(0.8);
    -webkit-mask-image: radial-gradient(ellipse at center, black 32%, transparent 70%);
    mask-image: radial-gradient(ellipse at center, black 32%, transparent 70%);
    z-index: 0;
    pointer-events: none;
  }
  .tube-column-v {
    position: relative;
    width: 20px;
    height: 100%;
    z-index: 1;
  }
  .tube-glow-v {
    position: absolute;
    inset: -30px -70px;
    opacity: 0;
    filter: blur(3px);
    pointer-events: none;
    transition: opacity 0.05s linear;
  }
  .tube-light-v {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    opacity: 0.4;
    transition: opacity 0.05s linear;
  }
  .tube-light-v::before, .tube-light-v::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 11px;
    background: #333;
    border-radius: 3px;
    z-index: 2;
  }
  .tube-light-v::before { top: -13px; }
  .tube-light-v::after { bottom: -13px; }
  .pillar-label-v {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    color: #ddd;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-weight: 300;
    pointer-events: none;
  }
  .pillar-label-v span {
    display: block;
    line-height: 1;
  }
  @media (max-width: 700px) {
    /* Bleiben nebeneinander wie am Desktop, nur enger gepackt – die
       Säulen-Breite pro Panel wird zusätzlich in JS gedeckelt, damit
       die Buchstaben der Labels nicht in die Nachbarspalte laufen. */
    #pillar-container {
      gap: 6px;
      padding: 0 56px 20px;
      top: 100px;
      bottom: 0;
    }
    .tube-pillar {
      min-width: 0;
      gap: 6px;
    }
  }

  #tube-fixture {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: min(640px, 85vw);
    height: 24px;
    z-index: 20;
    pointer-events: none;
  }
  #tube-glow {
    position: absolute;
    inset: -60px -30px auto -30px;
    height: 150px;
    background: radial-gradient(ellipse at center, rgba(226,240,255,0.75), rgba(226,240,255,0) 70%);
    opacity: 0;
    filter: blur(2px);
  }
  #tube-light {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffffff, #dce9ff);
    box-shadow: 0 0 18px 6px rgba(220,233,255,1), 0 0 48px 14px rgba(180,210,255,0.7);
    opacity: 0;
  }
  #tube-light::before, #tube-light::after {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 32px;
    background: #333;
    border-radius: 3px;
  }
  #tube-light::before { left: -12px; }
  #tube-light::after { right: -12px; }

  #dark-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 1.2s ease;
  }
  #dark-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #dark-message {
    text-align: center;
    color: #e8e8e8;
    animation: dark-blink 1.8s ease-in-out infinite;
    transition: opacity 0.3s ease;
  }
  #dark-overlay.revealing #dark-message {
    animation: none;
    opacity: 0;
  }
  #dark-message .line1 {
    display: block;
    font-size: 1.3rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  #dark-message .line2 {
    display: block;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: #999;
    text-transform: uppercase;
  }
  @keyframes dark-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
</style>
</head>
<body>
  <div id="hero"></div>
  <div id="wordmark-left" class="wordmark-vertical"></div>
  <div id="wordmark-right" class="wordmark-vertical"></div>
  <div id="pillar-container"></div>

  <div id="tube-fixture">
    <div id="tube-glow"></div>
    <div id="tube-light"></div>
  </div>

  <div id="dark-overlay">
    <div id="dark-message">
      <span class="line1">Zu dunkel hier drin.</span>
      <span class="line2">Klicken, um Licht zu machen.</span>
    </div>
  </div>

<script>
(function () {
  // Vertikale Wortmarke: Buchstaben von oben nach unten, links "Halogen",
  // rechts "Kulturverein". Beide Wörter füllen exakt die Viewport-Höhe,
  // die Schriftgröße pro Buchstabe ergibt sich automatisch aus der
  // Buchstabenanzahl – "Kulturverein" hat mehr Buchstaben, wird also
  // pro Buchstabe kleiner als "Halogen".
  function buildVerticalWord(container, word) {
    container.innerHTML = "";
    for (const ch of word) {
      const span = document.createElement("span");
      span.textContent = ch;
      container.appendChild(span);
    }
  }
  function sizeVerticalWord(container) {
    const available = window.innerHeight - 56; // minus vertikales Padding
    const count = container.children.length;
    // Auf schmalen Screens wären die Buchstaben sonst breiter als der
    // Platz neben den Panel-Säulen hergibt – zusätzlich an die Breite deckeln.
    const maxByWidth = window.innerWidth * 0.085;
    const fontSize = Math.max(8, Math.min((available / count) * 0.82, maxByWidth));
    container.style.fontSize = fontSize + "px";
  }
  const wordLeft = document.getElementById("wordmark-left");
  const wordRight = document.getElementById("wordmark-right");
  buildVerticalWord(wordLeft, "HALOGEN");
  buildVerticalWord(wordRight, "KULTURVEREIN");
  function resizeWordmarks() {
    sizeVerticalWord(wordLeft);
    sizeVerticalWord(wordRight);
  }
  resizeWordmarks();
  window.addEventListener("resize", resizeWordmarks);
})();
</script>

<script>
(async function () {
  const container = document.getElementById("pillar-container");
  const hero = document.getElementById("hero");

  let content = {};
  try {
    content = await fetch("/api/content").then(r => r.json());
  } catch (e) {
    console.warn("Konnte Inhalte nicht laden, nutze Standardwerte.", e);
  }

  if (content.hero_image_url) {
    hero.style.backgroundImage = `url("${content.hero_image_url}")`;
  }

  const panelDefs = [1, 2, 3, 4].map(i => ({
    label: content[`panel_${i}_label`] || `Panel ${i}`,
    link: content[`panel_${i}_link`] || "#",
    image: content[`panel_${i}_image_url`] || "",
    color: content[`panel_${i}_color`] || "#ffb703",
  }));

  function hexToRgb(hex) {
    const clean = (hex || "#ffb703").replace("#", "");
    const full = clean.length === 3 ? clean.split("").map(c => c + c).join("") : clean;
    const num = parseInt(full, 16) || 0xffb703;
    return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
  }

  function buildVerticalLabel(el, word) {
    el.innerHTML = "";
    for (const ch of word) {
      const span = document.createElement("span");
      span.textContent = ch;
      el.appendChild(span);
    }
  }

  function sizeVerticalLabel(el, availableHeightPx, availableWidthPx) {
    const count = el.children.length || 1;
    const byHeight = (availableHeightPx / count) * 0.78;
    // Bei vielen schmalen Spalten nebeneinander (z. B. auf Mobile) darf ein
    // einzelner Buchstabe nicht breiter werden als seine eigene Spalte,
    // sonst läuft das Label in die Nachbarsäule hinein.
    const byWidth = availableWidthPx ? availableWidthPx * 0.85 : Infinity;
    const fontSize = Math.max(7, Math.min(byHeight, byWidth));
    el.style.fontSize = fontSize + "px";
  }

  // Klont die angeklickte Säule und animiert sie auf volle Bildschirmgröße,
  // bevor zur Unterseite navigiert wird ("reinzoomen").
  function zoomIntoPanel(el, link) {
    const rect = el.getBoundingClientRect();
    const clone = el.cloneNode(true);
    clone.style.transform = "none";
    clone.style.position = "fixed";
    clone.style.left = rect.left + "px";
    clone.style.top = rect.top + "px";
    clone.style.width = rect.width + "px";
    clone.style.height = rect.height + "px";
    clone.style.margin = "0";
    clone.style.zIndex = "50";
    clone.style.transition = "left 0.5s ease, top 0.5s ease, width 0.5s ease, height 0.5s ease, border-radius 0.5s ease";
    document.body.appendChild(clone);
    clone.getBoundingClientRect(); // reflow erzwingen, damit die Transition greift

    requestAnimationFrame(() => {
      clone.style.left = "0px";
      clone.style.top = "0px";
      clone.style.width = "100vw";
      clone.style.height = "100vh";
      clone.style.borderRadius = "0px";
    });

    setTimeout(() => { window.location.href = link; }, 520);
  }

  // Kurze Variante der Flacker-Dramaturgie von der Decken-Röhre im
  // Dunkel-Intro, pro Säule in ihrer eigenen Farbe. Deutlich kürzer als
  // das einmalige Intro, weil das bei jedem einzelnen Klick abläuft.
  function playPillarFlicker(tubeLight, tubeGlow, onDone) {
    // Dips gehen bewusst dunkler als der helle Ruhezustand (0.4), damit
    // das Flackern als klarer An/Aus-Kontrast wahrnehmbar bleibt.
    const steps = [
      [30, 1], [35, 0.05], [70, 0.05],
      [20, 0.85], [20, 0.05], [15, 1], [10, 0.05], [15, 1], [10, 0.05],
      [140, 1],
    ];
    let t = 0;
    for (const [delay, brightness] of steps) {
      t += delay;
      setTimeout(() => {
        tubeLight.style.opacity = brightness;
        tubeGlow.style.opacity = brightness;
      }, t);
    }
    setTimeout(onDone, t + 150);
  }

  const pillars = panelDefs.map((def) => {
    const pillar = document.createElement("div");
    pillar.className = "tube-pillar";

    if (def.image) {
      const bg = document.createElement("div");
      bg.className = "pillar-bg";
      bg.style.backgroundImage = `url("${def.image}")`;
      pillar.appendChild(bg);
    }

    const column = document.createElement("div");
    column.className = "tube-column-v";
    const glow = document.createElement("div");
    glow.className = "tube-glow-v";
    const light = document.createElement("div");
    light.className = "tube-light-v";
    column.appendChild(glow);
    column.appendChild(light);

    const label = document.createElement("div");
    label.className = "pillar-label-v";
    buildVerticalLabel(label, def.label.toUpperCase());

    pillar.appendChild(column);
    pillar.appendChild(label);
    container.appendChild(pillar);

    const [r, g, b] = hexToRgb(def.color);
    light.style.background = `linear-gradient(180deg, #ffffff, rgb(${r},${g},${b}))`;
    light.style.boxShadow = `0 0 18px 6px rgba(${r},${g},${b},1), 0 0 46px 14px rgba(${r},${g},${b},0.75)`;
    glow.style.background = `radial-gradient(ellipse at center, rgba(${r},${g},${b},0.75), rgba(${r},${g},${b},0) 70%)`;

    let started = false;
    pillar.addEventListener("click", () => {
      if (started || def.link === "#") return;
      started = true;
      playPillarFlicker(light, glow, () => zoomIntoPanel(pillar, def.link));
    });

    return { pillar, label };
  });

  function resizeLabels() {
    const cs = getComputedStyle(container);
    const innerWidth = container.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const slotWidth = innerWidth / pillars.length;
    const labelWidthBudget = slotWidth - 20 - 16; // minus Röhre + Abstände
    for (const { pillar, label } of pillars) {
      sizeVerticalLabel(label, pillar.clientHeight - 20, labelWidthBudget);
    }
  }
  resizeLabels();
  window.addEventListener("resize", resizeLabels);
})();
</script>

<script>
(function () {
  const overlay = document.getElementById("dark-overlay");
  const tubeLight = document.getElementById("tube-light");
  const tubeGlow = document.getElementById("tube-glow");
  let started = false;

  function playFlicker() {
    // [Verzögerung in ms, Helligkeit 0-1] – simuliert eine Röhre, die
    // erst ein paar Mal ansetzt, bevor sie stabil an bleibt.
    const steps = [
      [40, 0.9], [70, 0], [900, 0],
      [30, 0.8], [40, 0], [25, 0.7], [200, 0],
      [20, 1], [15, 0], [15, 1], [10, 0], [15, 1], [10, 0], [180, 0],
      [15, 1], [15, 0], [500, 1],
    ];
    let t = 0;
    for (const [delay, brightness] of steps) {
      t += delay;
      setTimeout(() => {
        tubeLight.style.opacity = brightness;
        tubeGlow.style.opacity = brightness * 0.8;
      }, t);
    }
    setTimeout(() => overlay.classList.add("hidden"), t + 500);
  }

  overlay.addEventListener("click", () => {
    if (started) return;
    started = true;
    overlay.classList.add("revealing");
    overlay.style.pointerEvents = "none";
    playFlicker();
  });

  // Wer über den "Zurück"-Link einer Unterseite kommt, hat das Intro schon
  // gesehen – sofort in den enthüllten Zustand springen statt neu zu starten.
  if (new URLSearchParams(location.search).has("skip_intro")) {
    started = true;
    overlay.style.transition = "none";
    overlay.classList.add("revealing", "hidden");
    overlay.style.pointerEvents = "none";
    tubeLight.style.opacity = 1;
    tubeGlow.style.opacity = 0.8;
    history.replaceState(null, "", location.pathname);
  }
})();
</script>
</body>
</html>
