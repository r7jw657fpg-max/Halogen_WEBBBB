<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kulturverein Halogen</title>
<style>
  :root {
    --panel-bg: rgba(15, 15, 15, 0.82);
    --panel-fg: #f4f1ea;
    --accent: #ffb703;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  #hero {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-color: #111;
  }
  #hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55));
  }
  #wordmark {
    position: fixed;
    top: 32px;
    left: 32px;
    color: var(--panel-fg);
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 5;
    mix-blend-mode: difference;
  }
  .panel {
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 16px;
    background: var(--panel-bg);
    color: var(--panel-fg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(2px);
    transition: background 0.2s ease, transform 0.15s ease;
    will-change: transform;
    z-index: 3;
    user-select: none;
  }
  .panel:hover {
    background: var(--accent);
    color: #111;
  }
</style>
</head>
<body>
  <div id="hero"></div>
  <div id="wordmark">Kulturverein Halogen</div>
  <div id="panel-container"></div>

<script>
(async function () {
  const container = document.getElementById("panel-container");
  const hero = document.getElementById("hero");

  let content = {};
  try {
    content = await fetch("/api/content").then(r => r.json());
  } catch (e) {
    console.warn("Konnte Inhalte nicht laden, nutze Standardwerte.", e);
  }

  if (content.hero_image_url) {
    hero.style.backgroundImage = `url(${content.hero_image_url})`;
  }

  const panelDefs = [1, 2, 3, 4].map(i => ({
    label: content[`panel_${i}_label`] || `Panel ${i}`,
    link: content[`panel_${i}_link`] || "#",
  }));

  const SIZE = 190;
  const SPEED = 1.4;

  const panels = panelDefs.map((def, i) => {
    const el = document.createElement("div");
    el.className = "panel";
    el.textContent = def.label;
    el.addEventListener("click", () => { window.location.href = def.link; });
    container.appendChild(el);

    const angle = Math.random() * Math.PI * 2;
    return {
      el,
      x: Math.random() * (window.innerWidth - SIZE),
      y: Math.random() * (window.innerHeight - SIZE),
      vx: Math.cos(angle) * SPEED,
      vy: Math.sin(angle) * SPEED,
    };
  });

  function step() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    for (const p of panels) {
      p.x += p.vx;
      p.y += p.vy;

      if (p.x <= 0) { p.x = 0; p.vx *= -1; }
      if (p.x + SIZE >= w) { p.x = w - SIZE; p.vx *= -1; }
      if (p.y <= 0) { p.y = 0; p.vy *= -1; }
      if (p.y + SIZE >= h) { p.y = h - SIZE; p.vy *= -1; }

      p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
    }

    // Einfache Panel-zu-Panel-Kollision (Kreis-Annäherung)
    for (let i = 0; i < panels.length; i++) {
      for (let j = i + 1; j < panels.length; j++) {
        const a = panels[i], b = panels[j];
        const dx = (a.x + SIZE/2) - (b.x + SIZE/2);
        const dy = (a.y + SIZE/2) - (b.y + SIZE/2);
        const dist = Math.hypot(dx, dy);
        if (dist < SIZE * 0.9) {
          [a.vx, b.vx] = [b.vx, a.vx];
          [a.vy, b.vy] = [b.vy, a.vy];
        }
      }
    }

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
