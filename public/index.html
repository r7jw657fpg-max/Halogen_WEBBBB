<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kulturverein Halogen</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  #hero {
    position: fixed;
    inset: 0;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    background-color: #111;
    z-index: 0;
  }
  #hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55));
  }
  #hero-hotspots {
    position: fixed;
    inset: 0;
    z-index: 1;
  }
  .hero-hotspot {
    position: absolute;
    cursor: pointer;
    border-radius: 4px;
    transition: box-shadow 0.25s ease, background 0.25s ease;
  }
  .hero-hotspot:hover {
    box-shadow: 0 0 0 2px rgba(255,255,255,0.55), 0 0 24px rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06);
  }

  #pillar-container {
    position: fixed;
    inset: 0;
    z-index: 3;
    /* Deckt den ganzen Screen ab, ist aber selbst leer (nur die Schilder
       drin sind Inhalt) – ohne das hier würde es überall Klicks abfangen,
       auch dort wo kein Schild ist, und die Hero-Hotspots darunter blockieren. */
    pointer-events: none;
  }
  /* Jedes Schild ist eine Metallplatte, alle optisch identisch (gleiches
     Grau, gleicher Rahmen/Schatten), damit sie als eine einheitliche Ebene
     im Raum wirken statt gestapelt/gelayert auszusehen. */
  .neon-sign {
    position: absolute;
    cursor: pointer;
    user-select: none;
    pointer-events: auto;
    background: linear-gradient(160deg, #333333, #1c1c1c);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 22px 30px;
    box-shadow: 0 10px 22px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .neon-sign::before, .neon-sign::after {
    content: "";
    position: absolute;
    top: 9px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #9a9a9a, #2a2a2a);
  }
  .neon-sign::before { left: 9px; }
  .neon-sign::after { right: 9px; }
  .sign-cables {
    position: absolute;
    inset: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 0;
  }
  .sign-cables path {
    fill: none;
    stroke: rgba(15,15,15,0.9);
    stroke-width: 2;
    stroke-linecap: round;
  }
  .neon-word {
    position: relative;
    z-index: 1;
    display: inline-flex;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 3vw, 38px);
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    color: rgba(255,255,255,0.28);
    text-shadow: none;
    transition: color 0.35s ease, text-shadow 0.35s ease;
  }
  .neon-letter {
    color: inherit;
  }
  .neon-sign:hover .neon-word {
    color: #fff;
    text-shadow:
      0 0 6px var(--glow, #ffb703),
      0 0 14px var(--glow, #ffb703),
      0 0 28px var(--glow, #ffb703),
      0 0 50px var(--glow, #ffb703);
  }

  #tube-fixture {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: min(640px, 85vw);
    height: 24px;
    z-index: 20;
    pointer-events: none;
  }
  #tube-glow {
    position: absolute;
    inset: -60px -30px auto -30px;
    height: 150px;
    background: radial-gradient(ellipse at center, rgba(226,240,255,0.75), rgba(226,240,255,0) 70%);
    opacity: 0;
    filter: blur(2px);
  }
  #tube-light {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffffff, #dce9ff);
    box-shadow: 0 0 18px 6px rgba(220,233,255,1), 0 0 48px 14px rgba(180,210,255,0.7);
    opacity: 0;
  }
  #tube-light::before, #tube-light::after {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 32px;
    background: #333;
    border-radius: 3px;
  }
  #tube-light::before { left: -12px; }
  #tube-light::after { right: -12px; }

  #dark-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 1.2s ease;
  }
  #dark-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #dark-message {
    text-align: center;
    color: #e8e8e8;
    animation: dark-blink 1.8s ease-in-out infinite;
    transition: opacity 0.3s ease;
  }
  #dark-overlay.revealing #dark-message {
    animation: none;
    opacity: 0;
  }
  #dark-message .line1 {
    display: block;
    font-size: 1.3rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  #dark-message .line2 {
    display: block;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: #999;
    text-transform: uppercase;
  }
  @keyframes dark-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
</style>
</head>
<body>
  <div id="hero"></div>
  <div id="hero-hotspots"></div>
  <div id="pillar-container"></div>

  <div id="tube-fixture">
    <div id="tube-glow"></div>
    <div id="tube-light"></div>
  </div>

  <div id="dark-overlay">
    <div id="dark-message">
      <span class="line1">Zu dunkel hier drin.</span>
      <span class="line2">Klicken, um Licht zu machen.</span>
    </div>
  </div>

<script>
(async function () {
  const container = document.getElementById("pillar-container");
  const hero = document.getElementById("hero");

  let content = {};
  try {
    content = await fetch("/api/content").then(r => r.json());
  } catch (e) {
    console.warn("Konnte Inhalte nicht laden, nutze Standardwerte.", e);
  }

  if (content.hero_image_url) {
    hero.style.backgroundImage = `url("${content.hero_image_url}")`;
  }

  // Klickbare Bereiche über den Motiven im Hero-Bild (z. B. die gerahmten
  // Bilder an der Wand), im Admin-Bereich als Rechtecke auf dem Bild
  // aufgezogen und als Sekunden-relativ-zur-Bildgröße-Anteile gespeichert.
  // Da das Bild per background-size:contain immer komplett sichtbar ist
  // (ggf. mit Letterbox-Rand), muss die tatsächliche Bildfläche im
  // Viewport berechnet werden, um die Anteile richtig zu platzieren.
  (async function setupHeroHotspots() {
    let hotspots = [];
    try { hotspots = JSON.parse(content.hero_hotspots || "[]"); } catch (e) { hotspots = []; }
    if (!content.hero_image_url || !hotspots.length) return;

    const naturalSize = await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = content.hero_image_url;
    });
    if (!naturalSize) return;

    const hotspotContainer = document.getElementById("hero-hotspots");

    function renderHotspots() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const containerRatio = vw / vh;
      const imgRatio = naturalSize.w / naturalSize.h;
      let renderW, renderH;
      if (imgRatio > containerRatio) {
        renderW = vw;
        renderH = vw / imgRatio;
      } else {
        renderH = vh;
        renderW = vh * imgRatio;
      }
      const offsetX = (vw - renderW) / 2;
      const offsetY = (vh - renderH) / 2;

      hotspotContainer.innerHTML = "";
      for (const spot of hotspots) {
        const el = document.createElement("div");
        el.className = "hero-hotspot";
        el.style.left = (offsetX + spot.x * renderW) + "px";
        el.style.top = (offsetY + spot.y * renderH) + "px";
        el.style.width = (spot.w * renderW) + "px";
        el.style.height = (spot.h * renderH) + "px";
        if (spot.label) el.title = spot.label;
        el.addEventListener("click", () => {
          if (spot.link) window.location.href = spot.link;
        });
        hotspotContainer.appendChild(el);
      }
    }

    renderHotspots();
    window.addEventListener("resize", renderHotspots);
  })();

  const panelDefs = [1, 2, 3, 4].map(i => ({
    label: content[`panel_${i}_label`] || `Panel ${i}`,
    link: content[`panel_${i}_link`] || "#",
    color: content[`panel_${i}_color`] || "#ffb703",
  }));

  // Klont das angeklickte Leuchtschild und lässt es Richtung Kamera
  // "aufblühen" (Skalierung + Farbfläche blendet über den Screen), bevor
  // zur Unterseite navigiert wird.
  function zoomIntoSign(el, color, link) {
    const rect = el.getBoundingClientRect();
    const clone = el.cloneNode(true);
    clone.style.position = "fixed";
    clone.style.left = rect.left + "px";
    clone.style.top = rect.top + "px";
    clone.style.margin = "0";
    clone.style.zIndex = "60";
    clone.style.transformOrigin = "center center";
    clone.style.transition = "transform 0.5s ease";
    document.body.appendChild(clone);

    const flash = document.createElement("div");
    flash.style.cssText = `position:fixed; inset:0; background:${color}; opacity:0; z-index:55; transition:opacity 0.5s ease; pointer-events:none;`;
    document.body.appendChild(flash);

    clone.getBoundingClientRect(); // reflow erzwingen, damit die Transition greift
    requestAnimationFrame(() => {
      clone.style.transform = "scale(7)";
      flash.style.opacity = "1";
    });

    setTimeout(() => { window.location.href = link; }, 520);
  }

  // Kurze Flacker-Dramaturgie, pro Schild in seiner eigenen Farbe – wie die
  // Decken-Röhre im Dunkel-Intro, nur als Text statt als Röhrenform.
  function playSignFlicker(wordEl, color, onDone) {
    const off = { color: "rgba(255,255,255,0.28)", shadow: "none" };
    const glow = `0 0 6px ${color}, 0 0 14px ${color}, 0 0 28px ${color}, 0 0 50px ${color}`;
    const on = { color: "#fff", shadow: glow };
    const steps = [
      [30, on], [35, off], [70, off],
      [20, on], [20, off], [15, on], [10, off], [15, on], [10, off],
      [140, on],
    ];
    let t = 0;
    for (const [delay, state] of steps) {
      t += delay;
      setTimeout(() => {
        wordEl.style.color = state.color;
        wordEl.style.textShadow = state.shadow;
      }, t);
    }
    setTimeout(onDone, t + 150);
  }

  // Zeichnet je eine leicht durchhängende Kabelverbindung zwischen
  // benachbarten Buchstaben, wie bei einem klassischen, verdrahteten
  // Leuchtschild.
  function drawCables(sign) {
    const plateRect = sign.el.getBoundingClientRect();
    if (!plateRect.width || !plateRect.height) return;
    sign.svg.setAttribute("width", plateRect.width);
    sign.svg.setAttribute("height", plateRect.height);
    sign.svg.setAttribute("viewBox", `0 0 ${plateRect.width} ${plateRect.height}`);

    // Buchstaben-Boxen berühren sich innerhalb des Flex-Containers (kein
    // Zwischenraum zwischen den Kästen selbst) – von Kante zu Kante gäbe es
    // also keine sichtbare Spannweite. Von Mitte zu Mitte ergibt die
    // natürliche Kabellänge entlang des Buchstabenabstands.
    let d = "";
    for (let i = 0; i < sign.letters.length - 1; i++) {
      const a = sign.letters[i].getBoundingClientRect();
      const b = sign.letters[i + 1].getBoundingClientRect();
      const x1 = a.left - plateRect.left + a.width / 2;
      const y1 = a.top - plateRect.top + a.height * 0.28;
      const x2 = b.left - plateRect.left + b.width / 2;
      const y2 = b.top - plateRect.top + b.height * 0.28;
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2 + 8; // Durchhang
      d += `M${x1.toFixed(1)},${y1.toFixed(1)} Q${midX.toFixed(1)},${midY.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)} `;
    }
    sign.svg.innerHTML = `<path d="${d}"></path>`;
  }

  const signs = panelDefs.map((def) => {
    const el = document.createElement("div");
    el.className = "neon-sign";
    el.style.setProperty("--glow", def.color);

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "sign-cables");
    el.appendChild(svg);

    const word = document.createElement("span");
    word.className = "neon-word";
    const letters = [];
    for (const ch of def.label) {
      const letter = document.createElement("span");
      letter.className = "neon-letter";
      letter.textContent = ch === " " ? " " : ch;
      word.appendChild(letter);
      letters.push(letter);
    }
    el.appendChild(word);
    container.appendChild(el);

    const sign = { el, svg, word, letters, def };

    let started = false;
    el.addEventListener("click", () => {
      if (started || def.link === "#") return;
      started = true;
      playSignFlicker(word, def.color, () => zoomIntoSign(el, def.color, def.link));
    });

    return sign;
  });

  // Verteilt die Schilder zufällig auf dem Screen, ohne dass sie sich
  // überlappen (einfache Retry-Platzierung statt echter Kollisionsphysik,
  // da die Schilder – anders als früher – nicht mehr in Bewegung sind).
  // Alle Platten sind optisch identisch, damit der Eindruck einer
  // einzigen, ebenen Fläche entsteht statt gestapelter Ebenen.
  function placeSignsRandomly() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const topMargin = 140;
    const bottomMargin = 60;
    const sideMargin = 40;
    const placed = [];

    for (const sign of signs) {
      const width = sign.el.offsetWidth || 160;
      const height = sign.el.offsetHeight || 60;
      const maxX = Math.max(sideMargin, w - width - sideMargin);
      const maxY = Math.max(topMargin, h - height - bottomMargin);
      let x, y, attempts = 0;
      do {
        x = sideMargin + Math.random() * (maxX - sideMargin);
        y = topMargin + Math.random() * (maxY - topMargin);
        attempts++;
      } while (
        attempts < 40 &&
        placed.some(p =>
          x < p.x + p.width + 24 && x + width + 24 > p.x &&
          y < p.y + p.height + 24 && y + height + 24 > p.y
        )
      );
      sign.el.style.left = x + "px";
      sign.el.style.top = y + "px";
      placed.push({ x, y, width, height });
    }

    for (const sign of signs) drawCables(sign);
  }

  placeSignsRandomly();
  window.addEventListener("resize", placeSignsRandomly);
})();
</script>

<script>
(function () {
  const overlay = document.getElementById("dark-overlay");
  const tubeLight = document.getElementById("tube-light");
  const tubeGlow = document.getElementById("tube-glow");
  let started = false;

  function playFlicker() {
    // [Verzögerung in ms, Helligkeit 0-1] – simuliert eine Röhre, die
    // erst ein paar Mal ansetzt, bevor sie stabil an bleibt.
    const steps = [
      [40, 0.9], [70, 0], [900, 0],
      [30, 0.8], [40, 0], [25, 0.7], [200, 0],
      [20, 1], [15, 0], [15, 1], [10, 0], [15, 1], [10, 0], [180, 0],
      [15, 1], [15, 0], [500, 1],
    ];
    let t = 0;
    for (const [delay, brightness] of steps) {
      t += delay;
      setTimeout(() => {
        tubeLight.style.opacity = brightness;
        tubeGlow.style.opacity = brightness * 0.8;
      }, t);
    }
    setTimeout(() => overlay.classList.add("hidden"), t + 500);
  }

  overlay.addEventListener("click", () => {
    if (started) return;
    started = true;
    overlay.classList.add("revealing");
    overlay.style.pointerEvents = "none";
    playFlicker();
  });

  // Wer über den "Zurück"-Link einer Unterseite kommt, hat das Intro schon
  // gesehen – sofort in den enthüllten Zustand springen statt neu zu starten.
  if (new URLSearchParams(location.search).has("skip_intro")) {
    started = true;
    overlay.style.transition = "none";
    overlay.classList.add("revealing", "hidden");
    overlay.style.pointerEvents = "none";
    tubeLight.style.opacity = 1;
    tubeGlow.style.opacity = 0.8;
    history.replaceState(null, "", location.pathname);
  }
})();
</script>
</body>
</html>
