<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produkte – Kulturverein Halogen</title>
<style>
  body { margin:0; font-family:"Helvetica Neue",Arial,sans-serif; background:#111; color:#f4f1ea; }
  header { padding:32px; }
  a.back { color:#ffb703; text-decoration:none; font-size:0.9rem; }
  main { padding:0 32px 64px; max-width:720px; }
  h1 { text-transform:uppercase; letter-spacing:0.05em; }
</style>
</head>
<body>
<header><a class="back" href="/">&larr; Zurück</a></header>
<main>
  <h1 id="page-title">Produkte</h1>
  <div id="page-content">Lädt...</div>
</main>
<script>
fetch("/api/pages/produkte")
  .then(r => r.json())
  .then(data => {
    document.getElementById("page-title").textContent = data.title || "Produkte";
    document.getElementById("page-content").innerHTML = data.content || "";
  })
  .catch(() => {});
</script>
</body>
</html>
