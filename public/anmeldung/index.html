<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmeldung – Kulturverein Halogen</title>
<style>
  body { margin:0; font-family:"Helvetica Neue",Arial,sans-serif; background:#111; color:#f4f1ea; }
  header { padding:32px; position:relative; z-index:1; }
  a.back { color:#ffb703; text-decoration:none; font-size:0.9rem; }
  main { padding:0 32px 64px; max-width:720px; position:relative; z-index:1; }
  h1 { text-transform:uppercase; letter-spacing:0.05em; }
  #bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
  }
  #bg-overlay::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.75));
  }
  form {
    margin-top: 32px;
    padding: 24px;
    background: rgba(20,20,20,0.75);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    backdrop-filter: blur(3px);
  }
  label { display:block; margin:14px 0 4px; font-size:0.85rem; color:#ccc; }
  input[type=text], input[type=email] {
    width:100%; padding:10px; border-radius:6px; border:1px solid #444;
    background:#0c0c0c; color:#f4f1ea; font-family:inherit; font-size:1rem;
  }
  .checkbox-row {
    display:flex; align-items:flex-start; gap:10px; margin-top:18px; font-size:0.9rem; color:#ddd;
  }
  .checkbox-row input { margin-top:3px; }
  button {
    margin-top:20px; padding:12px 20px; background:#ffb703; border:none;
    border-radius:6px; font-weight:600; font-size:1rem; cursor:pointer;
  }
  button:disabled { opacity:0.5; cursor:default; }
  #signup-status { margin-top:14px; font-size:0.9rem; }
  #signup-status.ok { color:#8f8; }
  #signup-status.err { color:#f88; }
</style>
</head>
<body>
<div id="bg-overlay"></div>
<header><a class="back" href="/?skip_intro=1">&larr; Zurück</a></header>
<main>
  <h1 id="page-title">Anmeldung</h1>
  <div id="page-content">Lädt...</div>

  <form id="signup-form">
    <label for="signup-name">Name</label>
    <input type="text" id="signup-name" required autocomplete="name">

    <label for="signup-email">E-Mail</label>
    <input type="email" id="signup-email" required autocomplete="email">

    <div class="checkbox-row">
      <input type="checkbox" id="signup-accept" required>
      <label for="signup-accept" style="margin:0;">Ich akzeptiere die Vereinsstatuten des Kulturverein Halogen.</label>
    </div>

    <button type="submit" id="signup-btn">Ich bin ab heute Mitglied</button>
    <div id="signup-status"></div>
  </form>
</main>
<script>
fetch("/api/pages/anmeldung")
  .then(r => r.json())
  .then(data => {
    document.getElementById("page-title").textContent = data.title || "Anmeldung";
    document.getElementById("page-content").innerHTML = data.content || "";
    if (data.image_url) {
      document.getElementById("bg-overlay").style.backgroundImage = `url("${data.image_url}")`;
    }
  })
  .catch(() => {});

document.getElementById("signup-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("signup-name").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const accepted = document.getElementById("signup-accept").checked;
  const status = document.getElementById("signup-status");
  const btn = document.getElementById("signup-btn");

  if (!name || !email || !accepted) {
    status.textContent = "Bitte Name und E-Mail angeben und die Statuten akzeptieren.";
    status.className = "err";
    return;
  }

  btn.disabled = true;
  status.textContent = "";
  status.className = "";
  try {
    const res = await fetch("/api/anmeldung", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, accepted }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Server antwortete mit ${res.status}`);
    status.textContent = `Willkommen, ${name}! Du bist ab dem ${data.joinedDate} Mitglied des Kulturverein Halogen. ✓`;
    status.className = "ok";
    document.getElementById("signup-form").reset();
  } catch (err) {
    status.textContent = "Fehler: " + err.message;
    status.className = "err";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
